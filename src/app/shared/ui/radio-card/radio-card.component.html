<div class="ds-radio-card__radio">
  <div class="ds-radio-card__circle">
    @if (selected()) {
      <div class="ds-radio-card__dot"></div>
    }
  </div>
</div>

<div class="ds-radio-card__body">
  <span class="ds-radio-card__label">{{ label() }}</span>
  @if (sublabel()) {
    <span class="ds-radio-card__sublabel">{{ sublabel() }}</span>
  }
</div>

<!-- Bord droit de la carte : un choix se compare souvent sur un chiffre ou un
     état posé en face de son libellé (un volume, un périmètre déjà consulté).
     Slot nommé, donc les appels qui ne projettent rien ne bougent pas. -->
<ng-content select="[slot=meta]" />

@if (badge()) {
  <ds-badge [label]="badge()" status="info" variant="strong" size="s" />
}
