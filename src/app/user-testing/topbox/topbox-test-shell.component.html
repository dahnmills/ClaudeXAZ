<!-- ══ Top header (Qirin) ════════════════════════════════════════ -->
<ds-header [class.ut-header--dimmed]="headerDimmed()">
  <ds-logo slot="logo" [reversed]="true" />

  <ng-container slot="tabs">
    <ds-tab tone="reversed">Home</ds-tab>
    <ds-tab tone="reversed" [selected]="true">Buyers</ds-tab>
    <ds-tab tone="reversed">Policies</ds-tab>
    <ds-tab tone="reversed" [chevron]="true">Tools</ds-tab>
    <ds-tab tone="reversed" [chevron]="true">Configuration</ds-tab>
  </ng-container>

  <ng-container slot="actions">
    <ds-button-icon type="tertiary" [reversed]="true" size="s" ariaLabel="Search">
      <ds-icon name="search" [size]="16" />
    </ds-button-icon>
    <!-- « ? » : même mécanique de dropdown que le compte, à gauche de la barre
         d'actions. Deux entrées seulement — le centre d'aide, et l'aide-mémoire
         clavier, dont le raccourci est affiché DANS l'entrée. -->
    <div class="ut-help" (click)="$event.stopPropagation()">
      <ds-button-icon
        type="tertiary"
        [reversed]="true"
        size="s"
        ariaLabel="Help"
        (clicked)="toggleHelpMenu()"
      >
        <ds-icon name="help" [size]="16" />
      </ds-button-icon>
      @if (helpMenuOpen()) {
        <div class="ut-help__menu">
          <ds-flyout-menu>
            <ds-flyout-menu-item label="Help with Qirin" icon="launch" />
            <ds-flyout-menu-item
              label="Keyboard shortcuts"
              icon="keyboard"
              [shortcut]="['?']"
              (clicked)="openShortcutsPanel()"
            />
          </ds-flyout-menu>
        </div>
      }
    </div>
    <ds-button-icon type="tertiary" [reversed]="true" size="s" ariaLabel="Notifications">
      <ds-icon name="bell" [size]="16" />
    </ds-button-icon>
  </ng-container>

  <ng-container slot="account">
    <div class="ut-account" (click)="$event.stopPropagation()">
      <ds-tab tone="reversed" [chevron]="true" (clicked)="toggleAccountMenu()">John Doe</ds-tab>
      @if (accountMenuOpen()) {
        <div class="ut-account__menu">
          <ds-flyout-menu>
            <div class="ut-account__header">
              <p class="ut-account__name">John Doe</p>
              <p class="ut-account__mail">John.doe&#64;allianz-trade.com</p>
            </div>
            <div class="ut-account__sep"></div>
            <ds-flyout-menu-item label="Settings"  icon="settings" />
            <ds-flyout-menu-item label="Dark mode" icon="eye" />
            <ds-flyout-menu-item label="Act as"    icon="user" />
            <div class="ut-account__sep"></div>
            <ds-flyout-menu-item label="Log out"   icon="lock" />
          </ds-flyout-menu>
        </div>
      }
    </div>
  </ng-container>
</ds-header>

<!-- Modals/dialogs — rendus hors du scroll container .ut-main -->
<ng-content select="[slot=modals]" />

<!-- Aide-mémoire clavier — docké en bas, hors du scroll container. -->
<ds-shortcuts-panel
  [(open)]="shortcuts.panelOpen"
  [groups]="shortcutGroups"
  [used]="shortcuts.used()"
  [note]="shortcuts.note()"
  (activated)="onPanelActivate($event)"
/>
<!-- Onglet « Layout » en attente : le panneau l'affiche dès qu'on lui repasse
     [keyboard]="shortcuts.keyboardView()" et (layoutChange)="shortcuts.setLayout($event)".
     Il n'est PAS nécessaire au bon fonctionnement — les lettres sont reconnues
     par ce qui est gravé sur la touche (voir keyboard-layout.ts), donc les
     raccourcis marchent déjà à l'identique en AZERTY. L'onglet ne servirait qu'à
     le montrer. -->


<!-- ══ Layout : sidenav + main ══════════════════════════════════ -->
<div class="ut-layout">
  @if (showSidenav()) {
  <ds-side-nav [(collapsed)]="sideNavCollapsed">
    <ds-side-nav-item>
      <ds-icon slot="icon" name="home" [size]="24" />
      Home
    </ds-side-nav-item>
    <ds-side-nav-item>
      <ds-icon slot="icon" name="mail" [size]="24" />
      Messages
    </ds-side-nav-item>
    <ds-side-nav-item>
      <ds-icon slot="icon" name="chart" [size]="24" />
      Analytics
    </ds-side-nav-item>
    <ds-side-nav-item [selected]="true">
      <ds-icon slot="icon" name="buyers" [size]="24" />
      Buyers
    </ds-side-nav-item>
    <ds-side-nav-item>
      <ds-icon slot="icon" name="contract" [size]="24" />
      Contracts
    </ds-side-nav-item>
    <ds-side-nav-item>
      <ds-icon slot="icon" name="grid" [size]="24" />
      Applications
    </ds-side-nav-item>
  </ds-side-nav>
  }

  <main class="ut-main">
    <!-- Topbox (full width au-dessus du page-header) -->
    <div class="ut-main__topbox">
      <ng-content select="[slot=topbox]" />
    </div>

    <!-- Extension optionnelle (accordion expansion, animée) -->
    <div [class]="extensionClasses()">
      <div class="ut-main__extension-inner">
        <ng-content select="[slot=topbox-extension]" />
      </div>
    </div>

    <!-- Corps principal (page header + table) -->
    <div class="ut-main__body">
      <ng-content />
    </div>
  </main>
</div>
