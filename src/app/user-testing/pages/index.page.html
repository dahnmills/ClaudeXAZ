<main class="ix">
  <a class="ix__back" routerLink="/">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M19 12H5M11 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to Hub
  </a>

  <header class="ix__head">
    <span class="ix__eyebrow">Dev · Sandbox</span>
    <h1 class="ix__title">Qirin Prototype</h1>
    <p class="ix__lead">
      Browse freely through all screens, with the handoff inspector (Alt+I).
      Choose a screen to open.
    </p>
  </header>

  <ul class="ix__list">
    @for (s of screens; track s.path) {
      <li class="ix__item">
        <a class="ix__open" [routerLink]="s.path">
          <span class="ix__label-row">
            <span class="ix__label">{{ s.label }}</span>
            <span class="ix__version">{{ versionLabel(s.version) }}</span>
          </span>
          <span class="ix__hint">{{ s.hint }}</span>
          <code class="ix__url">/{{ s.path }}</code>
        </a>
      </li>
    }
  </ul>
</main>
