<h3 class="dt-title">{{ table().title }}</h3>
@if (table().rows.length) {
  <div [class]="'dt-table dt-l--' + pattern()" role="table" [attr.aria-label]="table().title">
    <ds-table-row>
      @for (col of table().columns; track col.label) {
        <ds-cell-header [title]="col.label" [align]="col.num ? 'right' : 'left'" />
      }
    </ds-table-row>
    @for (row of table().rows; track $index) {
      <ds-table-row>
        @for (v of row; track $index; let i = $index) {
          <ds-cell size="s" [align]="table().columns[i].num ? 'right' : 'left'">{{ v }}</ds-cell>
        }
      </ds-table-row>
    }
  </div>
} @else {
  <p class="dt-meta">{{ table().empty }}</p>
}
