<app-topbox-test-shell>
  <ds-page-header [topbox]="false" [breadcrumb]="true">
    <ds-breadcrumbs slot="breadcrumbs">
      <ds-crumb label="Home" href="#" />
      <ds-crumb label="Grade story" [currentPage]="true" />
    </ds-breadcrumbs>
    <ds-page-title slot="title" title="Grade story" />
  </ds-page-header>

  <div class="grade-story">
    <div class="grade-story__list">
      @for (entry of entries; track entry.id) {
        <gs-grade-story-row [entry]="entry" (scoreClicked)="openTram(entry)" (statusClicked)="openTag(entry)" />
      }
    </div>
  </div>

  <gs-tram-score-modal [open]="tramOpen()" [entry]="selected()" (closed)="closeTram()" />
  <gs-tag-explanation-modal [open]="tagOpen()" [entry]="selected()" (closed)="closeTag()" />
</app-topbox-test-shell>
