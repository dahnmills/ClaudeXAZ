name: Publish Design System Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dahnmills'

      - name: Install dependencies
        run: npm ci

      - name: Sync package version with the pushed tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: src/app/shared/ui

      - name: Build the package
        run: npm run build-lib

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: dist/design-system-lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
